events { } 

http {
  
    upstream my_api_group {
       
        server host.docker.internal:7075; 
    }

    server {
        listen 80; 

       
        location / {
            proxy_pass http://my_api_group;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}